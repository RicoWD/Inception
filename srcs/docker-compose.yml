services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: always

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    depends_on:
      - mariadb
      - redis
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DOMAIN_NAME: ${DOMAIN_NAME}
      SITE_TITLE: ${SITE_TITLE}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      USER_LOGIN: ${USER_LOGIN}
      USER_EMAIL: ${USER_EMAIL}
      USER_PASS: ${USER_PASS}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always

  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer:inception
    container_name: adminer
    depends_on:
      - mariadb
    environment:
      ADMINER_PORT: ${ADMINER_PORT}
    ports:
      - "${ADMINER_PORT}:${ADMINER_PORT}"
    networks:
      - inception
    restart: always

  nginx:
    image: nginx:inception
    container_name: nginx
    depends_on:
      - wordpress
    environment:
      NGINX_PORT: ${NGINX_PORT}
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always
    build:
      context: ./requirements/nginx
      args:
        LOGIN: ${LOGIN}

  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis:inception
    container_name: redis
    networks:
      - inception
    volumes:
      - redis_data:/data
    restart: always

  ftp:
    build:
      context: ./requirements/bonus/ftp
    image: ftp:inception
    container_name: ftp
    depends_on:
      - wordpress
    environment:
      FTP_USER: ${FTP_USER}
      FTP_PASS: ${FTP_PASS}
      FTP_PORT: ${FTP_PORT}
      FTP_PASV_MIN: ${FTP_PASV_MIN}
      FTP_PASV_MAX: ${FTP_PASV_MAX}
    ports:
      - "${FTP_PORT}:${FTP_PORT}"
      - "${FTP_PASV_MIN}-${FTP_PASV_MAX}:${FTP_PASV_MIN}-${FTP_PASV_MAX}"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always

  static_ws:
    build:
      context: ./requirements/bonus/static_ws
    image: static_ws:inception
    container_name: static_ws
    environment:
      STATIC_WS_PORT: ${STATIC_WS_PORT}
    ports:
      - "${STATIC_WS_PORT}:${STATIC_WS_PORT}"
    networks:
      - inception
    restart: always

  portainer:
    build:
      context: ./requirements/bonus/portainer
    image: portainer:inception
    container_name: portainer
    environment:
      PORTAINER_PORT: ${PORTAINER_PORT}
    ports:
      - "${PORTAINER_PORT}:${PORTAINER_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - inception
    restart: always

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/redis
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/portainer

networks:
  inception:
    driver: bridge
